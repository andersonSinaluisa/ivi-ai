name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo build --release --target x86_64-pc-windows-msvc

      - name: SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all

      # La firma Authenticode necesita un certificado real: sin secreto configurado, el artefacto
      # sale SIN firmar y el paso lo deja claro en lugar de aparentar que firmó (HU-WIN-051).
      - name: Firma Authenticode
        if: ${{ env.SIGNING_CERT_PFX != '' }}
        env:
          SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = [Convert]::FromBase64String($env:SIGNING_CERT_PFX)
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, $pfx)
          & signtool sign /f $path /p $env:SIGNING_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            target\x86_64-pc-windows-msvc\release\jarvis-agent.exe
          & signtool verify /pa /v target\x86_64-pc-windows-msvc\release\jarvis-agent.exe
          Remove-Item $path -Force

      - name: Aviso si no hay certificado
        if: ${{ env.SIGNING_CERT_PFX == '' }}
        run: echo "::warning::sin SIGNING_CERT_PFX: el binario NO va firmado y no debe distribuirse"

      - name: Hashes
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\release\jarvis-agent.exe'
          (Get-FileHash $exe -Algorithm SHA256).Hash + "  jarvis-agent.exe" | Out-File SHA256SUMS -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent
          path: |
            target/x86_64-pc-windows-msvc/release/jarvis-agent.exe
            target/x86_64-pc-windows-msvc/release/jarvis-agent.pdb
            SHA256SUMS
            **/*.cdx.json
