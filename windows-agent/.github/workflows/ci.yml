name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  # Todo lo que decide (protocolo, tooling, política, estado) es portable y se prueba sin Windows.
  test-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p jarvis-protocol -p jarvis-tooling -p jarvis-policy -p jarvis-state
      # La política no puede acabar dependiendo de Windows sin que nadie se entere.
      - name: la capa de decisión no depende de windows
        run: |
          if cargo tree -p jarvis-policy -p jarvis-tooling | grep -q "^.*windows v"; then
            echo "jarvis-policy/jarvis-tooling no deben depender del crate windows"; exit 1
          fi

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories bans licenses sources
