# Jarvis — Mosquitto 2.0.x (docs/03-protocols/mqtt-protocol.md, docs/06-infrastructure/networking.md)
per_listener_settings false
allow_anonymous false
allow_zero_length_clientid false

# Autenticación y ACL: Dynamic Security, administrado solo por jarvis-api.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Interno (red Docker backend), NO publicado: cloud client jarvis-cloud.
listener 1883
protocol mqtt

# Público: devices, solo TLS.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
max_connections 500

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Límites (docs/03-protocols/mqtt-protocol.md §9). Retained deshabilitado: la presencia vive en PostgreSQL.
retain_available false
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 120
set_tcp_nodelay true

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
