# Voz en el VPS: jarvis-stt (faster-whisper) y jarvis-tts (Piper). Proyecto compose propio, aparte del Cloud Core.
#   cd /opt/jarvis/compose/deploy/voice && sudo docker compose up -d --build
# Escuchan SOLO en 127.0.0.1 (JARVIS_STT_PORT=9100 y JARVIS_TTS_PORT=9200 por defecto, red del host; se cambian en
# deploy/.env si el servidor ya usa esos puertos). nginx los publica en /stt/ y /tts/ exigiendo la credencial
# de Jarvis (auth_request al Cloud Core). Los modelos se descargan una vez y se conservan en volúmenes.
name: jarvis-voice

x-hardening: &hardening
  network_mode: host
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 100
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  jarvis-stt:
    <<: *hardening
    build: ./stt
    image: jarvis-stt:local
    command: ["uvicorn", "server:app", "--host", "127.0.0.1", "--port", "${JARVIS_STT_PORT:-9100}", "--workers", "1", "--no-server-header"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request;d=json.load(urllib.request.urlopen('http://127.0.0.1:${JARVIS_STT_PORT:-9100}/health',timeout=4));exit(0 if d['ready'] else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}      # tiny | base | small (en CPU, small ya es lento)
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-3}     # 1 = más rápido; 3–5 = menos errores
      STT_PROMPT: ${STT_PROMPT:-Hola, Jarvis. Jarvis es mi asistente personal.}   # nombres que debe reconocer
    volumes:
      - stt-models:/models
    mem_limit: ${STT_MEM_LIMIT:-1500m}
    cpus: ${STT_CPUS:-2.0}

  jarvis-tts:
    <<: *hardening
    build: ./tts
    image: jarvis-tts:local
    command: ["uvicorn", "server:app", "--host", "127.0.0.1", "--port", "${JARVIS_TTS_PORT:-9200}", "--workers", "1", "--no-server-header"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request;d=json.load(urllib.request.urlopen('http://127.0.0.1:${JARVIS_TTS_PORT:-9200}/health',timeout=4));exit(0 if d['ready'] else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-es_MX-claude-high}   # otras: es_MX-ald-medium, es_ES-davefx-medium
    volumes:
      - tts-models:/models
    mem_limit: ${TTS_MEM_LIMIT:-768m}
    cpus: ${TTS_CPUS:-1.0}

volumes:
  stt-models:
  tts-models:
